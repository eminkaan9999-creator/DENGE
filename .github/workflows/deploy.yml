name: GitHub Pages'e Yayınla

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodunu al
        uses: actions/checkout@v6

      - name: Node.js'i hazırla
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Bağımlılıkları kur
        run: npm install

      - name: Uygulamayı derle
        run: npm run build

      - name: Pages ayarlarını hazırla
        uses: actions/configure-pages@v5

      - name: Yayın paketini yükle
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages'e yayınla
        id: deployment
        uses: actions/deploy-pages@v4
